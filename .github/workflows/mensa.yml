name: mensa-exam-watch

on:
  schedule:
    # 30分おき（UTC基準。GitHub側の混雑で数分〜数十分ずれます）
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: mensa-exam-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet requests

      - name: Run watcher
        run: python mensa_watch.py

      - name: Create issue on change
        if: hashFiles('ALERT_MENSA.md') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --title "MENSA 入会テスト 空き/新日程 $(TZ=Asia/Tokyo date '+%m/%d %H:%M')" \
            --body-file ALERT_MENSA.md

      - name: Commit state
        run: |
          rm -f ALERT_MENSA.md
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state-mensa/
          if git diff --staged --quiet; then
            echo "no state change"
          else
            git commit -m "mensa state: $(TZ=Asia/Tokyo date '+%Y-%m-%d %H:%M')"
            for i in 1 2 3; do
              git pull --rebase --autostash && git push && break
              echo "retry push ($i)"
              sleep 5
            done
          fi
